          <h1 style="font-size: 1.5rem; color: #e5c07b; margin: 0 0 1rem;">Privacy policy — Budget</h1>
          <p>Budget is a local-first budget app. Your ledger lives in your browser's local storage. There is no backend, no account on a server, and no behavioural tracking SDK. The production site loads a privacy-friendly page-view counter (GoatCounter) that records aggregated hits only. You can optionally sync the same JSON to your own Dropbox app folder.</p>
          <p>The full privacy policy needs JavaScript to render. Enable JavaScript and reload, or read the source on GitHub.</p>
