  </defs>
  <rect width="64" height="64" fill="#1d2027" />
  <g
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
    font-weight="700"
    font-size="50"
    text-anchor="middle"
  >
    <text x="32" y="48" fill="#e5c07b" opacity="0.35" filter="url(#glow)">$</text>
    <text x="32" y="48" fill="url(#gold)">$</text>
