name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch_ref:
        description: "Optional branch to also deploy at /branches/<slug>/. Leave blank to deploy only / and /preview/."
        required: false
        type: string
        default: ""
  # Allow release.yml to chain into us after a tag is pushed. The tag
  # passes in via `release_ref`; otherwise we resolve the latest `v*`
  # tag with `git describe`. Before the first release ever exists,
  # both lookups come up empty and we fall back to serving `main` at
  # `/` — same as the pre-release-pipeline behaviour.
  workflow_call:
    inputs:
      release_ref:
        description: "Tag or sha to build for the production '/' slot."
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # ---- Resolve which tag to serve at `/` (if any) ----
      - name: Resolve production tag
        id: tag
        run: |
          if [ -n "${{ inputs.release_ref }}" ]; then
            REF="${{ inputs.release_ref }}"
          else
            REF=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          fi
          if [ -n "$REF" ]; then
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
            echo "has_release=true" >> "$GITHUB_OUTPUT"
            echo "Resolved production ref: $REF"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "has_release=false" >> "$GITHUB_OUTPUT"
            echo "No release tag found — will serve main at /."
          fi

      # ---- Resolve optional branch deploy ----
      # `branch_ref` is only set on workflow_dispatch. A push to main
      # (or a workflow_call from release.yml) leaves it empty, which
      # drops any previously-deployed /branches/<slug>/ slot from the
      # artifact — Pages effectively garbage-collects branch deploys
      # the moment a fresh production publish lands without them.
      - name: Resolve branch deploy
        id: branch
        run: |
          REF="${{ inputs.branch_ref }}"
          if [ -z "$REF" ]; then
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "slug=" >> "$GITHUB_OUTPUT"
            echo "has_branch=false" >> "$GITHUB_OUTPUT"
            echo "No branch_ref input — skipping /branches/<slug>/ slot."
            exit 0
          fi
          SLUG=$(printf '%s' "$REF" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9-]+/-/g; s/-+/-/g; s/^-//; s/-$//')
          if [ -z "$SLUG" ]; then
            echo "branch_ref '$REF' slugifies to an empty string — refusing to deploy." >&2
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "has_branch=true" >> "$GITHUB_OUTPUT"
          echo "Resolved branch deploy: $REF -> /branches/$SLUG/"

      # ---- Production build (latest tag, root path) ----
      - name: Checkout production tag
        if: steps.tag.outputs.has_release == 'true'
        run: git checkout ${{ steps.tag.outputs.ref }}

      - name: Reinstall deps for production tag
        if: steps.tag.outputs.has_release == 'true'
        run: npm ci

      - name: Build production
        if: steps.tag.outputs.has_release == 'true'
        run: make build
        env:
          VITE_BASE_PATH: /
          VITE_DROPBOX_APP_KEY: ${{ secrets.VITE_DROPBOX_APP_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_DONATE_URL: ${{ secrets.VITE_DONATE_URL }}
          # Production-only: the preview and branch builds below
          # intentionally omit this so non-production slots never
          # include the tracker.
          VITE_GOATCOUNTER_ENDPOINT: ${{ secrets.VITE_GOATCOUNTER_ENDPOINT }}

      - name: Stash production dist
        if: steps.tag.outputs.has_release == 'true'
        run: mv dist dist-prod

      - name: Return to triggering ref
        if: steps.tag.outputs.has_release == 'true'
        run: git checkout ${{ github.sha }}

      - name: Reinstall main's deps
        if: steps.tag.outputs.has_release == 'true'
        run: npm ci

      # ---- Preview build (current main, /preview/ path) ----
      - name: Build preview
        run: make build
        env:
          # When no release exists yet this build serves at `/`; the
          # merge step below short-circuits and ships this dist as-is.
          # Once the first release lands, this becomes the /preview/
          # build instead.
          VITE_BASE_PATH: ${{ steps.tag.outputs.has_release == 'true' && '/preview/' || '/' }}
          VITE_DROPBOX_APP_KEY: ${{ secrets.VITE_DROPBOX_APP_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_DONATE_URL: ${{ secrets.VITE_DONATE_URL }}
          # Only pass the tracker endpoint when this build is the one
          # served at `/` (i.e. before the first release exists). Once
          # a release is in play this step is the `/preview/` slot
          # and must stay tracker-free. The `injectGoatcounter()`
          # plugin also skips on `IS_PREVIEW`, so this is belt-and-
          # braces — either guard alone would suffice.
          VITE_GOATCOUNTER_ENDPOINT: ${{ steps.tag.outputs.has_release == 'true' && '' || secrets.VITE_GOATCOUNTER_ENDPOINT }}

      # ---- Optional branch build (/branches/<slug>/ path) ----
      - name: Stash preview dist
        if: steps.branch.outputs.has_branch == 'true'
        run: mv dist dist-preview

      - name: Checkout branch ref
        if: steps.branch.outputs.has_branch == 'true'
        run: |
          git fetch origin "${{ steps.branch.outputs.ref }}"
          git checkout "${{ steps.branch.outputs.ref }}"

      - name: Reinstall deps for branch ref
        if: steps.branch.outputs.has_branch == 'true'
        run: npm ci

      - name: Build branch
        if: steps.branch.outputs.has_branch == 'true'
        run: make build
        env:
          VITE_BASE_PATH: /branches/${{ steps.branch.outputs.slug }}/
          VITE_DROPBOX_APP_KEY: ${{ secrets.VITE_DROPBOX_APP_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_DONATE_URL: ${{ secrets.VITE_DONATE_URL }}
          # Branch deploys are noindex + tracker-free, same posture as
          # the /preview/ slot.
          VITE_GOATCOUNTER_ENDPOINT: ""

      - name: Stash branch dist
        if: steps.branch.outputs.has_branch == 'true'
        run: mv dist dist-branch

      - name: Restore preview dist
        if: steps.branch.outputs.has_branch == 'true'
        run: mv dist-preview dist

      - name: Return to triggering ref after branch build
        if: steps.branch.outputs.has_branch == 'true'
        run: git checkout ${{ github.sha }}

      # ---- Merge ----
      - name: Merge builds
        run: |
          if [ -d dist-prod ]; then
            mv dist dist-preview
            mv dist-prod dist
            mkdir -p dist/preview
            # Only one CNAME may exist in the artifact (Pages picks the
            # root). Drop the per-slot copies before merging in.
            rm -f dist-preview/CNAME
            cp -R dist-preview/. dist/preview/
            echo "Merged: / = ${{ steps.tag.outputs.ref }}, /preview/ = ${{ github.sha }}"
          else
            echo "No release yet — serving main at / (no /preview/ slot)."
          fi
          if [ -d dist-branch ]; then
            SLUG="${{ steps.branch.outputs.slug }}"
            mkdir -p "dist/branches/$SLUG"
            rm -f dist-branch/CNAME
            cp -R dist-branch/. "dist/branches/$SLUG/"
            echo "Merged: /branches/$SLUG/ = ${{ steps.branch.outputs.ref }}"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
