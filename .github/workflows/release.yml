name: Release

# Manual-only. The maintainer dispatches this with a chosen semver
# bump; the workflow consumes .changes/unreleased/ into a new
# CHANGELOG section, bumps package.json, tags vX.Y.Z, pushes, creates
# a GitHub Release, then chains into pages.yml so the new tag is
# served at `/` (and the same code at `/preview/` because main now
# matches the tag) without waiting for the next push.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump"
        required: true
        type: choice
        default: minor
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # End-to-end Playwright suite against the same `/preview/` build the
  # Pages workflow assembles. Runs first so a regression in the
  # preview slot stops the release before any tag / commit lands.
  e2e:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/preview.yml
    permissions:
      contents: read

  release:
    runs-on: ubuntu-latest
    needs: e2e
    if: github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Verify clean working tree
        run: |
          if ! git diff --quiet || ! git diff --quiet --cached; then
            echo "::error::working tree is not clean — refusing to release"
            git status
            exit 1
          fi

      - name: Bump version
        id: bump
        run: |
          NEW=$(npm version ${{ inputs.bump }} --no-git-tag-version)
          echo "version=${NEW#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$NEW" >> "$GITHUB_OUTPUT"
          echo "Bumped to $NEW"

      - name: Collate changelog
        run: node scripts/release/collate-changelog.mjs "${{ steps.bump.outputs.version }}"

      - name: Extract release-notes body
        run: node scripts/release/extract-section.mjs "${{ steps.bump.outputs.version }}" > .release-notes.md

      - name: Sanity build
        run: make build
        env:
          VITE_BASE_PATH: /
          VITE_DROPBOX_APP_KEY: ${{ secrets.VITE_DROPBOX_APP_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Commit + tag
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json CHANGELOG.md .changes/unreleased
          git commit -m "chore(release): v${VERSION}"
          git tag -a "$TAG" -m "Release ${TAG}"
          git push origin HEAD:main
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.bump.outputs.tag }}" \
            --title "${{ steps.bump.outputs.tag }}" \
            --notes-file .release-notes.md

  deploy:
    # Chain straight into pages.yml so the new tag is served at `/`
    # immediately — without this, deployment would wait for the next
    # push to main (and `pages.yml`'s tag-resolution would already
    # find the new tag the push-trigger of release's own commit
    # creates, but the explicit chain is clearer and avoids any race).
    needs: release
    uses: ./.github/workflows/pages.yml
    with:
      release_ref: ${{ needs.release.outputs.tag }}
    permissions:
      # pages.yml declares `contents: write` at the top level because its
      # build job force-pushes the /branch/ slot to the `branch-deploy`
      # orphan branch. A reusable workflow can't be granted fewer
      # permissions than it requests, so granting only `contents: read`
      # here fails the whole Release run at startup before any job runs.
      contents: write
      pages: write
      id-token: write
    secrets: inherit
